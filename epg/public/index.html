
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TV Web + EPG (Node)</title>

  <style>
    body {
      margin: 0;
      background: #0b1220;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
    }

    .player {
      position: relative;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 14px;
      overflow: hidden;
    }

    .fake-video {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #94a3b8;
    }

    .epg {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 65%;
      background: rgba(0,0,0,0.75);
      padding: 16px;
      border-radius: 12px;
    }

    .channel {
      font-size: 13px;
      color: #60a5fa;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }

    .desc {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .time {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 8px;
    }

    .now {
      color: #facc15;
      font-weight: bold;
    }

    .progress {
      margin-top: 6px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: #facc15;
      width: 0%;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="player">
    <div class="fake-video">STREAM EN VIVO</div>

    <div class="epg">
      <div class="channel" id="channel"></div>
      <div class="title" id="title"></div>
      <div class="desc" id="desc"></div>

      <div class="time">
        <span id="time"></span>
        <span class="now">AHORA</span>
      </div>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>
  </div>

</div>

<script>
const XMLTV_URL = "/epg";
const CURRENT_CHANNEL_ID = "La1.es";

function parseXMLTVDate(str) {
  return new Date(Date.UTC(
    str.slice(0,4),
    str.slice(4,6) - 1,
    str.slice(6,8),
    str.slice(8,10),
    str.slice(10,12)
  ));
}

function percent(now, start, end) {
  return Math.min(
    100,
    Math.max(0, ((now - start) / (end - start)) * 100)
  );
}

async function loadEPG() {
  const res = await fetch(XMLTV_URL);
  const text = await res.text();

  const xml = new DOMParser()
    .parseFromString(text, "application/xml");

  const programmes = [...xml.querySelectorAll("programme")];
  const now = new Date();

  const current = programmes.find(p => {
    if (p.getAttribute("channel") !== CURRENT_CHANNEL_ID) return false;

    const start = parseXMLTVDate(p.getAttribute("start"));
    const stop  = parseXMLTVDate(p.getAttribute("stop"));

    return now >= start && now < stop;
  });

  if (!current) {
    document.getElementById("title").textContent = "Sin datos EPG";
    return;
  }

  const start = parseXMLTVDate(current.getAttribute("start"));
  const stop  = parseXMLTVDate(current.getAttribute("stop"));

  document.getElementById("channel").textContent = CURRENT_CHANNEL_ID;
  document.getElementById("title").textContent =
    current.querySelector("title")?.textContent || "";
  document.getElementById("desc").textContent =
    current.querySelector("desc")?.textContent || "";

  document.getElementById("time").textContent =
    `${start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
     -
     ${stop.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;

  document.getElementById("bar").style.width =
    percent(now, start, stop) + "%";
}

loadEPG();
setInterval(loadEPG, 60000);
</script>

</body>
</html>
